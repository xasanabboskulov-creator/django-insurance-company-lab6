
{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новая публикация — Страховая компания</title>
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
</head>
<body>

    <div class="container">
        <h1>Создание новой публикации</h1>

        <p class="subtitle">
            Страховая компания — информация о страховых услугах
        </p>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="title">Название публикации:</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ title }}"
                    placeholder="Например: Страхование домашнего имущества"
                    required
                >
            </div>

            <div class="form-group">
                <label for="text">Текст публикации:</label>
                <textarea
                    id="text"
                    name="text"
                    rows="8"
                    placeholder="Введите информацию о страховой услуге..."
                    required
                >{{ text }}</textarea>
            </div>

            {% if errors %}
                <div class="form-errors">
                    {% for error in errors %}
                        <p>{{ error }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            <button type="submit">Опубликовать</button>
        </form>

        <a href="{% url 'archive' %}" class="back-link">
            Вернуться на главную страницу
        </a>
    </div>

</body>
</html>

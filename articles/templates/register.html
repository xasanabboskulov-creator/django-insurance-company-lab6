
{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Страховая компания</title>
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
</head>
<body>

    <div class="container">
        <h1>Регистрация пользователя</h1>

        <p class="subtitle">
            Страховая компания — создание нового аккаунта
        </p>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Логин:</label>
                <input type="text" id="username" name="username"
                       value="{{ username }}" placeholder="Введите логин" required>
            </div>

            <div class="form-group">
                <label for="email">Электронная почта:</label>
                <input type="email" id="email" name="email"
                       value="{{ email }}" placeholder="Введите электронную почту" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password"
                       placeholder="Введите пароль" required>
            </div>

            <div class="form-group">
                <label for="password_confirm">Подтверждение пароля:</label>
                <input type="password" id="password_confirm" name="password_confirm"
                       placeholder="Повторите пароль" required>
            </div>

            {% if errors %}
                <div class="form-errors">
                    {% for error in errors %}
                        <p>{{ error }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            <button type="submit">Зарегистрироваться</button>
        </form>

        <a href="{% url 'login' %}" class="back-link">
            Уже есть аккаунт? Войти
        </a>

        <a href="{% url 'archive' %}" class="back-link">
            Вернуться на главную страницу
        </a>
    </div>

</body>
</html>

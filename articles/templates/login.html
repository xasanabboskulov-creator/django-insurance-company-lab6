
{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Страховая компания</title>
    <link rel="stylesheet" href="{% static 'css/article.css' %}">
</head>
<body>

    <div class="container">
        <h1>Вход в аккаунт</h1>

        <p class="subtitle">
            Страховая компания — авторизация пользователя
        </p>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Логин:</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    value="{{ username }}"
                    placeholder="Введите логин"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Пароль:</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Введите пароль"
                    required
                >
            </div>

            {% if errors %}
                <div class="form-errors">
                    {% for error in errors %}
                        <p>{{ error }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            <button type="submit">Войти</button>
        </form>

        <a href="{% url 'register' %}" class="back-link">
            Нет аккаунта? Зарегистрироваться
        </a>

        <br>

        <a href="{% url 'archive' %}" class="back-link">
            Вернуться на главную страницу
        </a>
    </div>

</body>
</html>
